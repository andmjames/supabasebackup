<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Supabase Backup</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      max-width: 560px; margin: 0 auto; padding: 48px 20px; line-height: 1.5;
      background: #0f1115; color: #e6e8eb;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p.sub { margin: 0 0 28px; color: #9aa0a6; font-size: 0.95rem; }
    label { display: block; font-size: 0.85rem; color: #9aa0a6; margin: 0 0 6px; }
    input {
      width: 100%; box-sizing: border-box; padding: 11px 12px; font-size: 0.95rem;
      border: 1px solid #2a2f38; border-radius: 8px; background: #171a20; color: #e6e8eb;
      margin-bottom: 20px;
    }
    button {
      width: 100%; padding: 13px; font-size: 1rem; font-weight: 600; cursor: pointer;
      border: none; border-radius: 8px; background: #3b82f6; color: #fff;
      transition: background 0.15s;
    }
    button:hover { background: #2f6fe0; }
    button:disabled { background: #2a2f38; color: #6b7280; cursor: default; }
    #status { margin-top: 20px; padding: 13px 15px; border-radius: 8px; font-size: 0.92rem; display: none; }
    #status.show { display: block; }
    #status.ok { background: #10241a; color: #6ee7a8; border: 1px solid #1f4a34; }
    #status.err { background: #2a1416; color: #f7a1a1; border: 1px solid #5a2626; }
    #status.info { background: #14202e; color: #8ec5ff; border: 1px solid #294764; }
    .foot { margin-top: 32px; font-size: 0.82rem; color: #6b7280; }
    code { background: #171a20; padding: 1px 5px; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Supabase Backup</h1>
  <p class="sub">Dumps every table to CSV, zips it, and emails the file.</p>

  <label for="token">Trigger token</label>
  <input id="token" type="password" placeholder="paste BACKUP_TRIGGER_TOKEN" autocomplete="off" />

  <button id="run">Run backup now</button>

  <div id="status"></div>

  <p class="foot">
    Runs automatically every Monday (scheduled in Supabase). Manual runs and the weekly job
    both use the background function, so the zip arrives by <strong>email</strong> a minute or two
    after you start it — it isn't downloaded here.
  </p>

  <script>
    const tokenInput = document.getElementById("token");
    const runBtn = document.getElementById("run");
    const statusEl = document.getElementById("status");

    // Remember the token in this browser only.
    tokenInput.value = localStorage.getItem("backupToken") || "";
    tokenInput.addEventListener("input", () => {
      localStorage.setItem("backupToken", tokenInput.value.trim());
    });

    function show(kind, msg) {
      statusEl.className = "show " + kind;
      statusEl.textContent = msg;
    }

    runBtn.addEventListener("click", async () => {
      const token = tokenInput.value.trim();
      if (!token) { show("err", "Enter your trigger token first."); return; }

      runBtn.disabled = true;
      show("info", "Starting backup…");

      try {
        const res = await fetch("/.netlify/functions/backup-background", {
          method: "POST",
          headers: { "Content-Type": "application/json", "x-backup-token": token },
          body: "{}",
        });

        if (res.status === 202 || res.ok) {
          show("ok", "Backup started. The zip will arrive by email in a minute or two.");
        } else if (res.status === 401) {
          show("err", "That token was rejected. Check it matches BACKUP_TRIGGER_TOKEN in Netlify.");
        } else {
          show("err", "Unexpected response (HTTP " + res.status + "). Check the function logs.");
        }
      } catch (e) {
        show("err", "Couldn't reach the function: " + e.message);
      } finally {
        setTimeout(() => { runBtn.disabled = false; }, 3000);
      }
    });
  </script>
</body>
</html>
